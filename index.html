<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Apply the saved theme before first paint. This runs synchronously in
      // <head> on purpose: doing it in React (a useEffect) lands after the
      // first paint, which flashes a light screen at dark-mode users, and it
      // only ran on pages that mount ThemeToggle — so the auth pages were
      // stuck light regardless of preference. Key must match useTheme.
      (function () {
        try {
          var stored = localStorage.getItem('kc-theme');
          // Light unless the visitor has explicitly chosen dark. Following the
          // OS meant most first impressions were the dark theme, which is not
          // the face this product should lead with.
          var dark = stored === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          // Keeps native controls, scrollbars and form widgets in the same theme.
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#FBFDFD" />
    <!-- iOS does not read the web manifest for these; it needs its own tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Klal Connect" />
    <title>Klal Connect — Community resources &amp; business directory</title>
    <meta name="description" content="Klal Connect is a community-powered platform for finding trusted Jewish professionals, businesses, and resources near you." />
    <meta property="og:title" content="Klal Connect — Community resources &amp; business directory" />
    <meta property="og:description" content="Find trusted Jewish professionals, businesses, and resources in your community." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klal Connect" />
    <meta property="og:image" content="/brand/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klal Connect — Community resources &amp; business directory" />
    <meta name="twitter:description" content="Find trusted Jewish professionals, businesses, and resources in your community." />
    <meta name="twitter:image" content="/brand/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
