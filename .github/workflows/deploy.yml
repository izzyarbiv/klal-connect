# Pushing to main deploys klalconnect.org — once, and then never by hand again.
#
# It did not. Deploys were manual `vercel --prod`, nothing said so, and six
# finished commits sat on GitHub unshipped for a day while every local check
# passed and the site looked fine. This is the fix for the cause rather than
# the symptom.
#
# Eli's pull requests are merged by auto-merge-eli.yml after both verification
# jobs pass, then workflow_dispatch ships the exact merge commit. Pushes to
# main also deploy directly. Inert until one secret exists. Add VERCEL_TOKEN under
# Settings -> Secrets and variables -> Actions, and every push to main ships
# after the checks pass. Without it the checks still run and the deploy step
# says what is missing instead of failing.
#
# Make a token at https://vercel.com/account/tokens (scope it to this project).
name: Verify and deploy

on:
  push:
    branches: [main]
  # Checked on the way in, not after it is already on main. This repo is
  # private on a free plan, so branch protection is unavailable and main cannot
  # be locked — a contributor with read access forking and opening a pull
  # request is what takes its place. That only works if the checks run on the
  # request, which is this. Fork pull requests get no secrets, and the verify
  # job needs none.
  pull_request:
    branches: [main]
  # So a deploy can be triggered from the Actions tab without an empty commit.
  workflow_dispatch:
    inputs:
      source_sha:
        description: Expected main commit to deploy
        required: false
        type: string

concurrency:
  # A newer push supersedes an older one rather than racing it to production.
  # Per branch: with one shared group, opening any pull request cancelled the
  # checks on every other one, so two open changes could never both go green.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Identifiers, not credentials — they name the project and are useless
  # without the token. Kept here so one secret is all that is needed.
  VERCEL_ORG_ID: team_9OEtj4nIlQcmhBCnyjfi88IK
  VERCEL_PROJECT_ID: prj_nyiApYO7JZcmwVY9NspRAc7jqHpz

# ubuntu-24.04 rather than ubuntu-latest: that label migrates to Ubuntu 26 from
# 19 October 2026, and an OS change under the deploy pipeline during a launch is
# a risk with no upside. Worth unpinning once there is a quiet week.
jobs:
  verify:
    # Nothing reaches production without these. The browser checks
    # (contrast, overflow, accessible names, critical paths, safe area) are
    # not here: they drive a Chrome at a hardcoded macOS path and need a dev
    # server, so they stay a local gate. These three need neither.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and API checks
        # api.test.mjs starts the app on an ephemeral port itself, so there is
        # no server to boot and no database to reach.
        run: npm test
      - name: Build
        run: npm run build

  browser:
    # What the verify job cannot see.
    #
    # verify checks logic: does it compile, do the permission rules hold, does
    # it build. It never opens the site, so it is blind to exactly the class of
    # bug that actually got reported here — text unreadable in dark mode,
    # boxes that do not fit a phone screen. Those checks existed but ran on one
    # laptop, which meant the only thing protecting the live site from a layout
    # or contrast regression was somebody remembering to run them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Make sure there is a browser
        # Guessing /usr/bin/google-chrome failed with "no debug target", which
        # is what these scripts say when Chrome never came up. Look for one,
        # and install it if the runner image does not ship it — the image's
        # contents change, and a check that silently needs a particular one is
        # a check that breaks later for no visible reason.
        run: |
          set -euo pipefail
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser /snap/bin/chromium; do
            if [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "no browser on this runner — installing Google Chrome"
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          /usr/bin/google-chrome --version

      - name: Start the app
        run: |
          KC_DEMO_MODE=1 KC_STORE=memory KC_EMAIL_DELIVERY=dev node server/index.js > /tmp/api.log 2>&1 &
          npx vite --port 5200 > /tmp/vite.log 2>&1 &
          # Wait for both rather than sleeping a fixed amount, which is how a
          # check ends up failing for being early and looking like a bug.
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health > /dev/null && curl -sf http://localhost:5200/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4000/api/health > /dev/null || { echo "API did not start"; cat /tmp/api.log; exit 1; }
          curl -sf http://localhost:5200/ > /dev/null || { echo "vite did not start"; cat /tmp/vite.log; exit 1; }

      - name: Can a person still join, post a listing and edit it
        run: npm run test:critical-paths

      - name: Does anything overflow a phone screen
        run: npm run test:overflow

      - name: Is every text readable in both themes
        run: npm run test:contrast

      - name: Does every control have a name a screen reader can say
        run: npm run test:a11y

  deploy:
    needs: [verify, browser]
    # A pull request is checked, never shipped. Only main reaches production.
    #
    # And only when the owner is the one shipping it. This repo is private on a
    # free plan, where a collaborator cannot be given read-only access and main
    # cannot be protected — so a second contributor necessarily has write
    # access and can push straight to main. That is survivable; what is not is
    # unreviewed code reaching the public site because someone pushed. Their
    # push still runs every check, and says why it stopped there.
    # Publishers are listed here and in explain-no-deploy below. To add one run:
    #   npm run add-publisher -- <github-username>
    if: github.event_name != 'pull_request' && (contains(fromJSON('["izzyarbiv", "eliepstein0817"]'), github.actor) || (github.actor == 'github-actions[bot]' && inputs.source_sha != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # stamp-build.mjs falls back to `git rev-parse` when
          # VERCEL_GIT_COMMIT_SHA is absent, and a shallow clone is enough
          # for that, but the full history lets deploy:status name the
          # commits a deployment is behind.
          fetch-depth: 0
      - name: Confirm the requested merge commit is on main
        if: inputs.source_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error title=Main advanced::The merged commit is no longer the tip of main; refusing to deploy a different revision."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check for a deploy token
        id: token
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::Checks passed, but VERCEL_TOKEN is not set, so nothing was deployed. Add it under Settings -> Secrets and variables -> Actions and push again."
          fi

      - name: Deploy to production
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Strip whitespace: a token pasted into `gh secret set` can carry a
          # stray space or newline, and Vercel rejects it outright ("Must not
          # contain: ' '"). That failed the first real deploy after every check
          # had passed.
          TOKEN="$(printf '%s' "$VERCEL_TOKEN" | tr -d '[:space:]')"
          # Pinned, not @latest. Deploys worked on 63.1.2 and broke the hour Vercel
          # shipped 64.0.2 with "Your deployment failed. Please retry later" after a
          # clean upload. No commit in between touched anything a deploy reads.
          # @latest meant every push gambled on whatever Vercel released that day.
          npx --yes vercel@63.1.2 pull --yes --environment=production --token="$TOKEN"
          npx --yes vercel@63.1.2 build --prod --token="$TOKEN"
          npx --yes vercel@63.1.2 deploy --prebuilt --prod --no-wait --token="$TOKEN" 2>&1 | tee /tmp/vercel-deploy.log

          DEPLOYMENT_HOST="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1 | sed 's#^https://##')"
          if [ -z "$DEPLOYMENT_HOST" ]; then
            echo "::error title=Deployment URL missing::Vercel did not return a deployment URL; see the deployment output above."
            exit 1
          fi

          export DEPLOYMENT_HOST
          node --input-type=module <<'NODE'
          const deploymentHost = process.env.DEPLOYMENT_HOST;
          const apiUrl = new URL(`/v13/deployments/${encodeURIComponent(deploymentHost)}`, 'https://api.vercel.com');
          apiUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);

          const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastState = '';
          for (let attempt = 0; attempt < 60; attempt += 1) {
            const response = await fetch(apiUrl, {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            });
            const body = await response.json();
            if (!response.ok) {
              console.error(`Could not inspect Vercel deployment (HTTP ${response.status}): ${body.error?.message || 'unknown API error'}`);
              process.exit(1);
            }

            const state = body.readyState || body.state || 'UNKNOWN';
            if (state !== lastState) {
              console.log(`Vercel deployment state: ${state}`);
              lastState = state;
            }
            if (state === 'READY') {
              console.log(`Vercel deployment is ready: https://${deploymentHost}`);
              process.exit(0);
            }
            if (state === 'ERROR' || state === 'CANCELED') {
              console.error(`Vercel deployment ${state.toLowerCase()}: ${body.errorCode || 'unknown error'} ${body.errorMessage || ''}`.trim());
              process.exit(1);
            }
            await delay(15_000);
          }

          console.error(`Vercel deployment did not become ready within 15 minutes; last state: ${lastState || 'unknown'}. Inspect https://${deploymentHost} in Vercel.`);
          process.exit(1);
          NODE

      - name: Confirm what landed
        if: steps.token.outputs.present == 'true'
        run: |
          # Exit 1 means production is behind, which is a real failure. Exit 2
          # means it could not tell — most often Vercel's bot challenge
          # answering a datacenter IP — and calling that a failed deploy would
          # be a lie, so it is a warning.
          for attempt in $(seq 1 12); do
            set +e
            npm run deploy:status
            code=$?
            set -e
            if [ "$code" = "0" ]; then
              exit 0
            fi
            if [ "$code" = "2" ]; then
              echo "::warning title=Could not confirm::Vercel's production endpoint could not be checked. See the output above."
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Production alias has not updated yet; checking again in 10 seconds ($attempt/12)."
              sleep 10
            fi
          done
          echo "::error title=Production is behind::The deployment is ready, but production is not running this commit."
          exit 1

  explain-no-deploy:
    needs: [verify, browser]
    # So a contributor sees why their push passed but did not go live, instead
    # of wondering whether it did.
    if: github.event_name == 'push' && !contains(fromJSON('["izzyarbiv", "eliepstein0817"]'), github.actor)
    runs-on: ubuntu-24.04
    steps:
      - name: Say why this did not deploy
        run: |
          echo "::notice title=Checked, not deployed::Every check passed. This did not go to the live site because deploys are run by the repository owner. Ask Izzy to ship it — he can do it from the Actions tab with 'Run workflow'."
